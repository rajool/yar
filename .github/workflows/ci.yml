name: CI

# Quality gates for the plugin: lint + test the guard scripts, validate the
# manifests, and dogfood the skill validator. The no-context merge gate lives in
# its own workflow (no-context.yml).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint & test (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Ruff and PyYAML
        # PyYAML is not optional in CI: without it validate.py falls back to its
        # lenient parser and cannot tell valid frontmatter from the kind the
        # runtime silently drops.
        run: python -m pip install --upgrade "ruff==0.15.15" "PyYAML==6.0.2"
      - name: Ruff (lint)
        run: ruff check .
      - name: Unit & integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1])); print(sys.argv[1], 'ok')" "$f"
          done
      - name: Validate skills (dogfood validate.py)
        run: |
          status=0
          for d in skills/*/; do
            python3 skills/skill-builder/scripts/validate.py "$d" || status=1
          done
          exit $status

  release-gate:
    name: Release gate (manifest, versions, frontmatter)
    # The one check that reads this repo the way Claude Code does: it fails on a
    # skill or agent whose frontmatter the loader cannot parse, and on a
    # plugin.json version that disagrees with the marketplace entry. Both are
    # invisible to the linters above -- and both shipped to users once.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace manifest
        run: claude plugin validate . --strict
      - name: Plugin, versions and frontmatter agree
        # --dry-run creates nothing; it validates and reports the tag it would cut.
        run: claude plugin tag --dry-run .

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ShellCheck (pinned to match local dev)
        run: python -m pip install --upgrade "shellcheck-py==0.11.0.1"
      - name: Run ShellCheck
        run: shellcheck $(git ls-files '*.sh') scripts/pre-commit

  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Run markdownlint
        run: npx --yes markdownlint-cli2
